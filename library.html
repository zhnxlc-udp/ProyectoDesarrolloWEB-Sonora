<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">

	<link rel="stylesheet" href="style.css">

</head>

<body>
	<header class="encabezado">

			<img src="logonormal.png" alt="Logo Sonora">
			<h1>Sonora | Reproductor musical</h1>
		</div>

        <!--Inicio de sesión-->
		<div class="login">
            <p>
                Inicia sesión o regístrate <a href="login.html">aquí</a>
            </p>
        </div>
	</header>

    <nav>
        <a href="index.html">Inicio</a> | <a href="library.html">Biblioteca</a>            
    </nav>

    <main class="pagina-central">
        <section class="columan-principal">
            <!--BARRA DE BÚSQUEDA-->
            <div class="barra-busqueda">
                <p>
                    <input type="text" placeholder="Busca tus canciones o artistas:">
                    <button>Buscar</button>
                </p>
            </div>
            
            <!--TOP CANCIONES-->
            <h2>Biblioteca | Mis favoritos</h2>
            <div class="galeria-portadas">
                
            </div>
        </section>

            <!--REPRODUCIENDO/PLAYLIST/COLA-->
            <aside class="barra-lateral">

                <ul>
                    <li>Escuchaste: TOP...</li>
                    <li>Agregaste: Playlist Favoritos</li>
                </ul>
            </aside>

    <!--Reproductor musical-->
	<footer class="reproductor">

            <p><strong>Sin reproducir</strong> - Seleccione pista</p>
        </div>
        <div class="controles-reproduccion">

        </div>
	</footer>
